name: Java CI with Maven + NodeJS

on:
  push:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    - name: Set up JDK 11
      uses: actions/setup-java@v3
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: maven
    - name: Set up nodejs
      uses: actions/setup-node@v3
      with:
        node-version: '14.x'
    - name: Build Javascript
      run: npm install && npm run esbuild
    - name: Build with Maven
      run: mvn -B package --file pom.xml -Djar.finalName=pan

    # Optional: Uploads the full dependency graph to GitHub to improve the quality of Dependabot alerts this repository can receive
    - name: Update dependency graph
      uses: advanced-security/maven-dependency-submission-action@571e99aab1055c2e71a1e2309b9691de18d6b7d6

    # Plain scp from the runner instead of a third-party action: the SSH key
    # never goes through external code, and there is no bundled Node
    # dependency to break when GitHub bumps the actions runtime.
    - name: deploy to VPS
      env:
        HOST: ${{ secrets.HOST }}
        USERNAME: ${{ secrets.USERNAME }}
        PORT: ${{ secrets.PORT }}
        SSHKEY: ${{ secrets.SSHKEY }}
        KNOWN_HOSTS: ${{ secrets.KNOWN_HOSTS }}
      run: |
        install -d -m 700 ~/.ssh
        printf '%s\n' "$SSHKEY" > ~/.ssh/deploy_key
        chmod 600 ~/.ssh/deploy_key
        if [ -n "$KNOWN_HOSTS" ]; then
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          HOSTKEY_OPT="StrictHostKeyChecking=yes"
        else
          HOSTKEY_OPT="StrictHostKeyChecking=accept-new"
        fi
        scp -i ~/.ssh/deploy_key -P "${PORT:-22}" -o "$HOSTKEY_OPT" \
          target/*.jar "$USERNAME@$HOST:/app/"
