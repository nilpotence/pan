name: Java CI with Maven + NodeJS

on:
  push:
    branches: [ "main" ]

# Least privilege for GITHUB_TOKEN: the dependency graph submission needs
# to write; nothing else does.
permissions:
  contents: write

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up JDK 17
      uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
    - name: Set up nodejs
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '24.x'
    - name: Build Javascript
      run: npm install && npm run esbuild
    - name: Build with Maven
      run: mvn -B package --file pom.xml -Djar.finalName=pan

    # Optional: Uploads the full dependency graph to GitHub to improve the quality of Dependabot alerts this repository can receive
    - name: Update dependency graph
      uses: advanced-security/maven-dependency-submission-action@a64327a7329c9939cf675e458452febe1894a70c # v6.0.1

    # Plain OpenSSH from the runner instead of a third-party action: the SSH
    # key never goes through external code, and there is no bundled Node
    # dependency to break when GitHub bumps the actions runtime.
    #
    # The jar is uploaded under a temporary name next to the target, then
    # renamed over it (sftp uses posix-rename: atomic, replaces the file).
    # Overwriting the jar in place corrupts the running JVM, which lazily
    # loads classes from the file it has open (NoClassDefFoundError); with a
    # rename it keeps reading the old file until it is restarted.
    # Only sftp commands are used, so this works for an sftp-only account.
    - name: deploy to VPS
      env:
        HOST: ${{ secrets.HOST }}
        USERNAME: ${{ secrets.USERNAME }}
        PORT: ${{ secrets.PORT }}
        SSHKEY: ${{ secrets.SSHKEY }}
        KNOWN_HOSTS: ${{ secrets.KNOWN_HOSTS }}
      run: |
        install -d -m 700 ~/.ssh
        printf '%s\n' "$SSHKEY" > ~/.ssh/deploy_key
        chmod 600 ~/.ssh/deploy_key
        if [ -n "$KNOWN_HOSTS" ]; then
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          HOSTKEY_OPT="StrictHostKeyChecking=yes"
        else
          HOSTKEY_OPT="StrictHostKeyChecking=accept-new"
        fi
        set -- target/*.jar
        if [ "$#" -ne 1 ] || [ ! -f "$1" ]; then
          echo "expected exactly one jar in target/, found: $*" >&2
          exit 1
        fi
        JAR_NAME=$(basename "$1")
        TMP_NAME=".$JAR_NAME.uploading"
        printf '%s\n' \
          "put $1 /app/$TMP_NAME" \
          "rename /app/$TMP_NAME /app/$JAR_NAME" > deploy.sftp
        sftp -b deploy.sftp -i ~/.ssh/deploy_key -P "${PORT:-22}" \
          -o "$HOSTKEY_OPT" -o BatchMode=yes "$USERNAME@$HOST"
