server.forward-headers-strategy=native

spring.web.error.whitelabel.enabled=false
server.compression.enabled=true
server.compression.mime-types=text/html, text/css, image/svg+xml, application/javascript, text/javascript, application/json, application/font-woff2
server.http2.enabled=true

# Static files: cached for a year by browsers. Safe only because the bundle
# URLs carry a content hash (/bundle/index-<md5>.css), so a deploy changes
# them. Templates must always link bundles through <@spring.url>, which adds
# the hash.
spring.web.resources.chain.strategy.content.enabled=true
spring.web.resources.chain.strategy.content.paths=/bundle/**
spring.web.resources.cache.cachecontrol.max-age=365d
spring.web.resources.cache.cachecontrol.cache-public=true
# Explicit cap on urlencoded form bodies (photos are posted as data URLs).
server.tomcat.max-http-form-post-size=2MB

spring.output.ansi.enabled=ALWAYS

spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=pan
spring.jpa.properties.hibernate.hbm2ddl.extra_physical_table_types=MATERIALIZED VIEW
spring.jpa.hibernate.ddl-auto=validate
spring.mvc.hiddenmethod.filter.enabled=true

spring.freemarker.settings.auto_import=common/layout.ftlh as layout, /spring.ftl as spring
spring.freemarker.settings.object_wrapper=no.api.freemarker.java8.Java8ObjectWrapper(Configuration.VERSION_2_3_31)
spring.freemarker.settings.template_exception_handler=rethrow
spring.devtools.restart.additional-exclude=/db/**

logging.level.org.springframework.security=INFO
