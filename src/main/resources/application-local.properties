server.forward-headers-strategy=NONE

spring.datasource.url=jdbc:postgresql://db:5432/postgres?currentSchema=pan
spring.datasource.username=pan
spring.datasource.password=password

pan.remember-me-key=ubersecret

# Dev only: SQL statements and their bound parameter values (password
# hashes, user ids, comments...) must never reach production logs.
spring.jpa.properties.hibernate.show_sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
